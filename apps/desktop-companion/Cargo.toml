[package]
name = "ghoststate-companion"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Local-only GhostState native messaging and BLE companion"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0"
base64 = "0.22"
btleplug = "0.11.8"
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["bluetoothd"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Devices_Bluetooth", "Devices_Bluetooth_GenericAttributeProfile", "Foundation", "Storage_Streams"] }
